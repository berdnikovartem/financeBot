spring.application.name=spring-example
spring.datasource.url=jdbc:postgresql://localhost:5332/avertys
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Override both values in deployment. The defaults only keep local development bootable.
app.jwt.secret=${APP_JWT_SECRET}
app.encryption.key=${APP_ENCRYPTION_KEY}
app.bootstrap.email=${APP_BOOTSTRAP_EMAIL:7artanis@gmail.com}
app.cookies.secure=${APP_COOKIES_SECURE:false}
app.worker.service-token=${APP_WORKER_SERVICE_TOKEN}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
