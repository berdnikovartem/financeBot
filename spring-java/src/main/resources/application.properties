spring.application.name=spring-example
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${APP_JWT_SECRET}
app.encryption.key=${APP_ENCRYPTION_KEY}
app.worker.service-token=${APP_WORKER_SERVICE_TOKEN}
app.cookies.secure=${APP_COOKIES_SECURE:true}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
