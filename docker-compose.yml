version: '3.8'

services:
  app:
    build: .
    container_name: finance_bot_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/artem
      SPRING_DATASOURCE_USERNAME: artem
      SPRING_DATASOURCE_PASSWORD: 123456
    networks:
      - bot-network

  db:
    image: postgres:16-alpine
    container_name: finance_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: artem
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: artem
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5332:5432"
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge

volumes:
  postgres_data: